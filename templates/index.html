<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Movie Recommendation System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar { background: rgba(0,0,0,0.3) !important; }
        .container-main { max-width: 1100px; margin: 40px auto; padding: 20px; }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
        }
        .search-box {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"], select {
            border: none;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 1rem;
        }
        .btn-recommend {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-recommend:hover {
            transform: translateY(-2px);
            color: white;
        }
        .recommendations {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .movie-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border-left: 5px solid #667eea;
            transition: all 0.3s ease;
        }
        .movie-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        .rank-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            line-height: 50px;
            font-weight: bold;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        .percentage {
            font-size: 2rem;
            color: #28a745;
            font-weight: bold;
        }
        .error { background: #fff3cd; color: #856404; padding: 15px; border-radius: 8px; margin: 10px 0; }
        .success { background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin: 10px 0; }
        .loading { display: none; text-align: center; margin: 20px 0; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .stats-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }
        .stat-item { text-align: center; }
        .stat-value { font-size: 1.8rem; font-weight: bold; color: #667eea; }
        .stat-label { color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand"><i class="fas fa-film"></i> Movie Recommendation</span>
        </div>
    </nav>

    <div class="container-main">
        <div class="card">
            <div class="card-header">
                <h1><i class="fas fa-star"></i> Movie Recommendation System</h1>
                <p>Find movies similar to your favorites using AI</p>
            </div>

            <div class="card-body p-4">
                <!-- Search Section -->
                <div class="search-box">
                    <input type="text" id="movieInput" placeholder="Enter a movie title..." class="form-control">
                    <select id="topN" class="form-select">
                        <option value="5">Top 5</option>
                        <option value="10">Top 10</option>
                        <option value="15">Top 15</option>
                    </select>
                    <button class="btn btn-recommend" onclick="getRecommendations()">
                        <i class="fas fa-search"></i> Search
                    </button>
                </div>

                <!-- Messages -->
                <div id="errorMsg" class="error" style="display:none;"></div>
                <div id="successMsg" class="success" style="display:none;"></div>

                <!-- Loading -->
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Finding similar movies...</p>
                </div>

                <!-- Results -->
                <div id="results"></div>

                <!-- Stats -->
                <div class="stats-section" id="stats"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        async function getRecommendations() {
            const movieInput = document.getElementById('movieInput').value.trim();
            const topN = document.getElementById('topN').value;
            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            const resultsDiv = document.getElementById('results');
            const loadingDiv = document.getElementById('loading');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            resultsDiv.innerHTML = '';

            if (!movieInput) {
                errorDiv.textContent = '❌ Please enter a movie name';
                errorDiv.style.display = 'block';
                return;
            }

            loadingDiv.style.display = 'block';

            try {
                const response = await fetch('/api/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ movie_name: movieInput, top_n: parseInt(topN) })
                });

                const data = await response.json();
                loadingDiv.style.display = 'none';

                if (data.success) {
                    successDiv.textContent = `✅ Found recommendations for "${data.movie}"`;
                    successDiv.style.display = 'block';

                    let html = '<div class="recommendations">';
                    data.recommendations.forEach(rec => {
                        html += `
                            <div class="movie-card">
                                <div class="rank-badge">#${rec.rank}</div>
                                <h5>${rec.name}</h5>
                                <div class="percentage">${rec.percentage}%</div>
                                <small>Match Score: ${rec.score}</small>
                            </div>
                        `;
                    });
                    html += '</div>';
                    resultsDiv.innerHTML = html;
                } else {
                    errorDiv.textContent = `❌ ${data.error}`;
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                loadingDiv.style.display = 'none';
                errorDiv.textContent = `❌ Error: ${error.message}`;
                errorDiv.style.display = 'block';
            }
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                const statsDiv = document.getElementById('stats');

                statsDiv.innerHTML = `
                    <div class="stat-item">
                        <div class="stat-value">${data.total_movies}</div>
                        <div class="stat-label">Total Movies</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${data.total_users}</div>
                        <div class="stat-label">Users</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${data.avg_rating.toFixed(2)}</div>
                        <div class="stat-label">Avg Rating</div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadStats);
        document.getElementById('movieInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') getRecommendations();
        });
    </script>
</body>
</html>
